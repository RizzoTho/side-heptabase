<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Side Heptabase</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <!-- normal mode: editor -->
  <div id="editor-view" hidden>
    <nav id="tabs" role="tablist">
      <button class="tab active" role="tab" aria-selected="true" data-target="card">note card</button>
      <button class="tab" role="tab" aria-selected="false" data-target="journal">journal</button>
    </nav>

    <div id="editor-card">
      <div id="source-title" title="">…</div>
      <div id="editor" contenteditable="true" data-placeholder="write in markdown…" data-empty="true" spellcheck="false"></div>
    </div>

    <div id="send-row">
      <button id="save-btn" disabled>send</button>
    </div>

    <div id="status" role="status"></div>
  </div>

  <!-- re-auth mode: full-panel connect page -->
  <div id="connect-view" hidden>
    <div class="connect-box">
      <img class="connect-icon" src="../icons/icon128.png" alt="" width="56" height="56" />
      <h2>连接 Heptabase</h2>
      <p>授权后，你在这里写的笔记会连同当前页面链接一起保存到你的 Heptabase 知识库。</p>
      <button id="connect-btn">连接 Heptabase</button>
      <div id="connect-status" role="status"></div>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>

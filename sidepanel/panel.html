<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Side Heptabase</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <main id="editor-view" hidden aria-labelledby="editor-heading">
    <h1 id="editor-heading" class="sr-only">Capture a note</h1>
    <div id="tabs" role="group" aria-label="Save destination">
      <button type="button" class="tab active" aria-pressed="true" data-target="card"><span class="tab-icon" aria-hidden="true"></span><span>Note</span></button>
      <button type="button" class="tab" aria-pressed="false" data-target="journal"><span class="tab-icon" aria-hidden="true"></span><span>Journal</span></button>
    </div>

    <section id="editor-card" aria-labelledby="source-title">
      <div class="source-row" aria-label="Current page">
        <span class="source-icon" aria-hidden="true"></span>
        <span class="source-copy"><span id="source-title" title="">…</span><span id="source-host"></span></span>
      </div>
      <div id="editor" role="textbox" aria-label="Note content" aria-multiline="true" aria-placeholder="Write in Markdown…" aria-keyshortcuts="Control+Enter Meta+Enter" contenteditable="true" data-placeholder="Write in Markdown…" data-empty="true" spellcheck="false"></div>
      <div id="send-row">
        <div id="status" role="status" aria-live="polite"></div>
        <button type="button" id="save-btn" data-state="idle" disabled aria-busy="false"><span class="save-label">Add</span><span class="save-glyph" aria-hidden="true"></span></button>
      </div>
    </section>
  </main>

  <main id="connect-view" hidden aria-labelledby="connect-heading">
    <div class="connect-box glass">
      <span class="connect-icon" aria-hidden="true"></span>
      <h1 id="connect-heading">Connect Heptabase</h1>
      <button type="button" id="connect-btn" aria-busy="false">Connect</button>
      <div id="connect-status" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="../floating/icons.js"></script>
  <script src="../floating/meta-icon.js"></script>
  <script type="module" src="panel.js"></script>
</body>
</html>

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test tests/*.test.mjs

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/package.sh "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
